defaults:
  contribution_model: fork_pr
  git_provider: github
  upstream_owner: AfterShip
  clone_protocol: ssh
  config_path: "~/.config/notification-repo-map/config.yaml"

branch_tracks:
  production:
    description: "Stable production branch."
    candidates:
      - master
  legacy_v9:
    description: "Legacy maintenance branch for products still pinned to older Module Federation/runtime versions."
    candidates:
      - master_v9
  active_major:
    description: "Current large-version notification/flow work. Prefer the Polaris v13 branch when present."
    candidates:
      - feat/flow-v3-polaris-v13
      - feat/flow-v3

domain_conventions:
  admin_aftership:
    audience: "External B-side merchant admin products."
    testing: "https://admin.aftership.io"
    release_pattern: "https://<release>-admin.aftership.io"
    staging: "https://staging-admin.aftership.com"
    production: "https://admin.aftership.com"
  admin_automizely:
    audience: "Internal admin/operations products."
    testing: "https://admin.automizely.me"
    release_pattern: "https://<release>-admin.automizely.me"
    staging: "https://staging-admin.automizely.org"
    production: "https://admin.automizely.org"
  sdks_am_static:
    audience: "Module Federation JavaScript/static assets."
    testing: "https://sdks.am-static.io"
    release_pattern: "https://<release>-sdks.am-static.io"
    staging: "https://staging-sdks.am-static.com"
    production: "https://sdks.am-static.com"

