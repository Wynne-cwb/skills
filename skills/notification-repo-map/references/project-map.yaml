      production: master
      legacy_v9:
      active_major:
    module_federation:
      enabled: false
    packages: []
    responsibility: "Storefront Automizely Marketing/Conversions browser SDK bundles, Shopify extensions, signup widgets, back-in-stock registration, popup bars, social proof, recommendation display, and public BFF wiring."
    related_projects:
      - bff-api.automizely.com_marketing_public
      - bff-api.automizely.com_recommendation
      - marketing.automizely.com
    flows:
